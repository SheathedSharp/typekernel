name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # `boolean` brings skia-pathops, which the overlap check in `tk audit`
        # needs; without it those tests can only assert the "not installed"
        # path, and the feature itself would go unexercised in CI.
        run: pip install -e ".[dev,specimen,compile,boolean]"
      - name: Pytest
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy -p typekernel
