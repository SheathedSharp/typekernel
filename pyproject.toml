[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "typekernel"
version = "0.0.0"
description = "Optical / design-semantics kernel for fonts-as-code (depends on fontTools; does not rebuild OT tables)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "zayju", email = "zayju@users.noreply.github.com" },
]
keywords = [
  "fonts",
  "typography",
  "fonttools",
  "type-design",
  "optical",
  "ufo",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
  "Topic :: Text Processing :: Fonts",
]
dependencies = [
  "fonttools>=4.50",
  "pillow>=10",
  "skia-pathops>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.17,<0.18",
  "mypy>=1.11",
]
boolean = [
  # skia-pathops is a hard dependency since the live renderer (perceive);
  # extra kept so existing ``pip install typekernel[boolean]`` still resolves.
  "skia-pathops>=0.8",
]
compile = [
  "ufoLib2>=0.16",
  "fontmake>=3.9",
  "ufo2ft>=2.33",
  "munkres>=1.1",
]
release = [
  "fontbakery>=1.0",
]
specimen = [
  # pillow is a hard dependency since the live renderer (perceive);
  # extra kept so existing ``pip install typekernel[specimen]`` still resolves.
  "pillow>=10",
]

[project.scripts]
tk = "typekernel.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/SheathedSharp/typekernel"
Repository = "https://github.com/SheathedSharp/typekernel"
Issues = "https://github.com/SheathedSharp/typekernel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typekernel = ["py.typed", "starters/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# No ``select``: this project enforces ruff's curated default set. That set
# grows between releases, so ``ruff`` is version-pinned in the ``dev`` extra
# above — bumping it is a deliberate commit that may surface new rules.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["typekernel"]

[[tool.mypy.overrides]]
module = [
  "fontTools.*",
  "pathops",
  "uharfbuzz",
  "ufoLib2",
  "ufoLib2.*",
  "fontmake",
  "fontmake.*",
  "ufo2ft",
  "ufo2ft.*",
]
ignore_missing_imports = true

# Starter templates are *project* code: ``tk new`` copies them into a user's
# font project, where ``elements`` / ``system`` resolve because the project
# directory is put on ``sys.path`` at runtime. They are written the way user
# project code is written (no annotations), so ``strict`` does not apply.
[[tool.mypy.overrides]]
module = "typekernel.starters.*"
ignore_errors = true
